# Smallest drill substrate: one repository, one work item.
#
# The work item is wi-1001, the standalone (non-campaign) item whose full
# lifecycle event stream, worker death at 2026-08-05T14:16:40Z included,
# is the first sixteen lines of
# ../../observability/sample-events.jsonl: discovered, claimed, started,
# stalled, reattached under the same session identity, prepared, effect
# committed and acknowledged, verified, published, acknowledged in the
# system of record. The manifest for the completed attempt is in
# work-manifests/wi-1001.json.
#
# Drills that need a minimal estate seed from this file: one repository
# to move a base in, one work item to kill an executor of, one session
# identity to reattach.

estate:
  snapshot: code-index@2026-08-05
  canonical_identity: repository@revision

repositories:
  - name: billing-service
    revision: f9e8d7c6b5a4          # head after wi-1001 published; the work
                                    # was planned against a1b2c3d4e5f6
    depends_on: []
    symbols:
      - symbol: InvoiceAdapter.Emit
        relation: defines
        path: billing/invoice_adapter.go

work_items:
  - work_id: wi-1001
    repository: billing-service
    base_revision: a1b2c3d4e5f6
    generation: 1
    attempts: 2                     # attempt 1 died on host-03; attempt 2
                                    # attached to session sess-771 on host-04
    session_id: sess-771
    conflict_key: billing-service/invoice-adapter
    tenant_id: team-payments
    outcome: acknowledged 2026-08-05 (commit f9e8d7c6b5a4 is an ancestor
      of billing-service/main)
