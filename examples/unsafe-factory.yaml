# A software factory contract for a team that ships pull requests from
# issues. It is schema-valid, it reads like a contract someone thought about,
# and it describes a factory that will duplicate effects, publish unverified
# artifacts, and report campaigns complete while targets remain untouched.
#
# Six defects fail review and ten more draw warnings. The exercise, and the
# answer key, are in examples/README.md. Try reading the file before the
# checker reads it for you.

version: factory.reliability/v1

factory:
  name: unsafe-factory

authorities:
  facts:     { system: work-store, record: work_items }
  procedure: { system: workflow-engine }
  policy:    { system: workflow-engine }
  effects:   { system: workers }

work:
  logical_identity: work_id
  attempt_identity: attempt_id
  session_identity: session_id
  ownership:
    generation: claim_generation
    lease_expiry: claim_expires_at
    fence:
      # The worker confirms it still owns the claim before it writes.
      enforced_by: caller
      operation: read-then-write

artifacts:
  identity: commit_sha
  verification:
    identity: ci_run_id
    # CI reports against the branch it built.
    binds_to: branch_name
  publication:
    conditions:
      - current_generation
      - expected_base_revision

effects:
  - name: create_pull_request
    destination: code_host
    # Each attempt gets its own operation key so retries are traceable.
    effect_identity: "pr_op_{attempt_id}"
    retry_contract: reconcile
    unknown_state_policy: block_and_escalate
  - name: send_notification
    destination: messaging
    effect_identity: notification_id
    retry_contract: deduplicate

scheduling:
  capacity: { total: 100 }

campaigns:
  completion:
    all_children_finished: true

observability:
  promises:
    - ready_to_claim
    - claimed_to_started
